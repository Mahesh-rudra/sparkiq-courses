<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SparkIQ Arduino Course: Interactive Lessons</title>
<style>
:root{
  --bg:#f6f7fb;--card:#ffffff;--ink:#1b2430;--muted:#5d6b7c;--line:#dfe4ec;
  --accent:#2563eb;--accent-ink:#ffffff;--ok:#16a34a;--bad:#dc2626;--warn-bg:#fef3c7;--warn-ink:#7c4a03;
  --code-bg:#0f172a;--code-ink:#e2e8f0;--code-hl:#1e3a8a;--code-dim:#64748b;
  --board:#0e7490;--wire:#334155;--ghost:#b6c0cf;--led:#ef4444;--graph:#2563eb;--graph2:#d97706;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1020;--card:#141b2e;--ink:#e8edf6;--muted:#93a1b5;--line:#26324b;
    --accent:#60a5fa;--accent-ink:#0b1020;--ok:#4ade80;--bad:#f87171;--warn-bg:#3b2a07;--warn-ink:#fcd34d;
    --code-bg:#070b16;--code-hl:#1d3a7a;--board:#0e7490;--wire:#cbd5e1;--ghost:#3a4764;--graph:#60a5fa;--graph2:#fbbf24;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:12px 14px 48px}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.nav select{flex:1;min-width:0;font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
.tag{font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{font-size:26px;line-height:1.2;margin:4px 0 6px}
.lead{color:var(--muted);margin:0 0 4px}
.parts{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{font-size:18px;margin:0 0 4px;display:flex;gap:8px;align-items:center}
h2 .n{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
svg{width:100%;height:auto;display:block}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#hold{min-height:60px;flex:1;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#hold.down{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;min-height:64px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.hide{display:none!important}
.opt{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px}
.opt input{width:20px;height:20px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:8px 0;margin:0;font:14px/1.9 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto}
.ln{display:flex;gap:10px;padding:0 12px;white-space:pre;min-width:max-content}
.ln i{font-style:normal;color:var(--code-dim);width:20px;text-align:right;flex:none;user-select:none}
.ln.on{background:var(--code-hl)}
.ln .c{color:#7dd3a8}
.ln input,.ln select{font:inherit;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:6px;padding:0 6px}
.ln input{width:64px;text-align:center}
.pinrow{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;font-size:14px}
.pill{border-radius:999px;padding:2px 12px;font-weight:600;font-size:14px;border:1px solid var(--line)}
.pill.hi{background:var(--led);color:#fff;border-color:var(--led)}
canvas{width:100%;display:block;background:var(--bg);border-radius:10px}
.readout{margin-top:8px;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);min-height:22px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stats:empty{display:none}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.q{margin:14px 0 0}
.q p{margin:0 0 6px;font-weight:600}
.q .ch{display:flex;flex-direction:column;gap:6px}
.q .ch button{text-align:left;min-height:44px}
.q .ch button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.q .ch button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.exp{font-size:14px;color:var(--muted);margin-top:6px}
.score{font-weight:700;margin-top:14px}
.math{font-size:14px;color:var(--muted);margin-top:8px}
.chain{display:flex;gap:6px;align-items:stretch;margin:10px 0}
.chain .box{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-size:13px}
.chain .box b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chain .arrow{align-self:center;color:var(--muted)}
.chain .box.act{border-color:var(--accent)}
.bulb{width:28px;height:28px;border-radius:50%;margin:4px auto 2px;background:var(--line);border:2px solid var(--ink)}
.bulb.on{background:var(--led);box-shadow:0 0 14px 4px var(--led)}
input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.rv{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
table.cmp{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.cmp th{color:var(--muted);font-weight:600}
.reg{cursor:pointer}
.reg.sel rect,.reg.sel circle{stroke:#fbbf24;stroke-width:3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{min-height:40px;padding:4px 12px;font-size:14px}
.chips button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.desc{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px;min-height:72px}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.chk.done span{color:var(--muted);text-decoration:line-through}
details{border-bottom:1px solid var(--line);padding:8px 0;font-size:15px}
summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:600}
details p{margin:6px 0 4px;color:var(--muted)}
.stages{display:flex;gap:4px;font-size:13px}
.stages span{flex:1;text-align:center;padding:6px 2px;border-radius:8px;background:var(--bg);color:var(--muted)}
.stages span.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.stages span.done{color:var(--ok);font-weight:600}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0}
#upbar{height:100%;width:0;background:var(--accent)}
.leds{display:flex;gap:16px;align-items:center;margin:8px 0}
.ld{display:inline-flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.ld i{width:16px;height:16px;border-radius:50%;background:var(--line);border:1px solid var(--ink);display:block;margin-bottom:2px}
.ld.on i{background:#fbbf24;box-shadow:0 0 8px #fbbf24}
.console{background:var(--code-bg);color:#7dd3a8;border-radius:10px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:96px;white-space:pre-wrap;margin:0}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pgrid button{min-height:44px;padding:4px;font-weight:600}
.pgrid button.hl{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pgrid button.dim{opacity:.3}
.pgrid button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.frow{display:flex;gap:8px;align-items:center;margin:6px 0}
.frow label{min-width:120px;font-size:14px;color:var(--muted)}
.ldsel{flex:1;min-width:0;font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px}
.ans{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;width:120px;background:var(--card);color:var(--ink)}
.formula{font-size:20px;font-weight:700;text-align:center;background:var(--bg);border-radius:10px;padding:12px;margin:8px 0}
.bulb.faint{background:var(--led);opacity:.35;box-shadow:none}
#pthold.down{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#pthold{min-height:56px;flex:1;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tf{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600;font-size:14px}
.tf.t{background:color-mix(in srgb,var(--ok) 20%,var(--card));color:var(--ok)}
.tf.f{background:color-mix(in srgb,var(--bad) 15%,var(--card));color:var(--bad)}
#tfhold.down{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#tfhold{min-height:56px;flex:1;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<script src="lessons/manifest.js"></script>
</head>
<body>
<main>
  <nav class="nav" aria-label="Lessons">
    <button id="prev" aria-label="Previous lesson">‹</button>
    <select id="pick" aria-label="Choose a lesson"></select>
    <button id="next" aria-label="Next lesson">›</button>
  </nav>
  <div id="app"></div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var SVGNS="http://www.w3.org/2000/svg";
  var M=window.MANIFEST||[];
  var L=null, R={}, wired=0, running=false, noRes=false, btn=false, inVal=0, P={}, tl=[], cycle=1;
  var S={}, loopStart=0, setupUntil=0, curLines="", hist=[], W=0, H=0, total=1, dots=[];
  window.__L=window.__L||{};
  window.UNO={seq:function(segs,now,S){ if(S.t0===undefined) S.t0=now; var tot=0,i; for(i=0;i<segs.length;i++) tot+=segs[i].ms; var u=(now-S.t0)%tot, acc=0; for(i=0;i<segs.length;i++){ acc+=segs[i].ms; if(u<acc) return {seg:segs[i],i:i,cycle:tot}; } return {seg:segs[segs.length-1],i:segs.length-1,cycle:tot}; }, garble:function(str,seed){ var ch="#@%&?~^*¿Ø¤§",o="",h=seed; for(var i=0;i<str.length;i++){ if(str[i]==="\n"){ o+="\n"; continue; } h=(h*31+str.charCodeAt(i)+7)%9973; o+=(str[i]===" "&&h%3)?" ":ch[h%ch.length]; } return o; }, adcOf:function(v){ return Math.max(0,Math.min(1023,Math.floor(v*1024/5))); }, ldrOhms:function(l){ return 100000*Math.pow(0.01,l/100); }};

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function isAnalog(){ return L.circuit.type==="pot"||L.circuit.type==="ldr"; }
  function plain(){ return L.circuit.type==="disp"||L.circuit.type==="usb"||L.circuit.type==="row"||L.circuit.type==="traffic"||L.circuit.type==="rgb"||(isAnalog()&&!L.circuit.led); }
  function hasLed(){ return !plain(); }
  function wireIds(){
    var t=L.circuit.type;
    if(t==="disp"){ var da=[]; for(var dq=0;dq<L.circuit.groups;dq++) da.push("d"+dq); return da; }
    if(t==="usb") return ["u1"];
    if(t==="rgb") return ["g0","g1","g2","g3"];
    if(t==="traffic") return ["t0","t1","t2","t3"];
    if(t==="row") return ["r0","r1","r2","r3","r4"];
    if(t==="pot"||t==="ldr"){ var b=t==="pot"?["p1","p2","p3"]:["l1","l2","l3","l4"]; return L.circuit.led?b.concat(["n5","n6","n7"]):b; }
    return t==="button"?["b1","b2"]:["w1","w2","w3"];
  }
  function need(){ return wireIds().length; }


  /* ---------- access gate (locked lessons are AES-GCM encrypted files) ---------- */
  var G=window.GATE||null, KEYS={};
  function b64(s){ var b=atob(s),a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function kekFor(code,w){
    var enc=new TextEncoder();
    return crypto.subtle.importKey("raw",enc.encode(code.trim().toUpperCase()),"PBKDF2",false,["deriveKey"]).then(function(k){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(w.salt),iterations:w.iters,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
    });
  }
  function decryptB64(key,s){
    var a=b64(s);
    return crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(0,12)},key,a.slice(12)).then(function(p){ return new TextDecoder().decode(p); });
  }
  function unwrap(code,w){
    return kekFor(code,w).then(function(kek){
      var a=b64(w.wrap);
      return crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(0,12)},kek,a.slice(12));
    }).then(function(raw){ return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]); });
  }
  function tryCode(code){
    var jobs=[], ids=Object.keys((G&&G.courses)||{});
    ids.forEach(function(id){
      G.courses[id].wraps.forEach(function(w){
        jobs.push(unwrap(code,w).then(function(key){ KEYS[id]=key; return id; }).catch(function(){ return null; }));
      });
    });
    return Promise.all(jobs).then(function(r){
      var ok=r.filter(function(x){ return x; });
      if(!ok.length) throw new Error("bad");
      try{ var arr=JSON.parse(localStorage.getItem("course_codes")||"[]"), c=code.trim().toUpperCase(); if(arr.indexOf(c)<0) arr.push(c); localStorage.setItem("course_codes",JSON.stringify(arr)); }catch(e){}
      return ok;
    });
  }
  function isLocked(m){ return !!m.locked&&!KEYS[m.course]; }

  /* ---------- navigation ---------- */
  var pick=$("pick");
  function fillPick(){
    var cur=pick.value; pick.innerHTML="";
    M.forEach(function(m){ var o=document.createElement("option"); o.value=m.id; o.textContent=m.num+"  "+m.title+(isLocked(m)?"  (locked)":""); pick.appendChild(o); });
    if(cur) pick.value=cur;
  }
  fillPick();
  function idx(){ for(var i=0;i<M.length;i++) if(M[i].id===pick.value) return i; return 0; }
  function go(id){ if(location.hash!=="#"+id) location.hash=id; else route(); }
  pick.onchange=function(){ go(pick.value); };
  $("prev").onclick=function(){ var i=idx(); if(i>0) go(M[i-1].id); };
  $("next").onclick=function(){ var i=idx(); if(i<M.length-1) go(M[i+1].id); };
  window.addEventListener("hashchange",route);

  function route(){
    var id=(location.hash||"").replace("#","");
    var m=M.filter(function(x){return x.id===id})[0]||M[0];
    if(!m){ $("app").textContent="No lessons yet."; return; }
    pick.value=m.id;
    $("prev").disabled=idx()===0; $("next").disabled=idx()===M.length-1;
    running=false; L=null; if(R.upTimer){ clearInterval(R.upTimer); R.upTimer=null; } if(R.stTimer){ clearInterval(R.stTimer); R.stTimer=null; } R.anim=null;
    if(window.__L[m.id]){ render(window.__L[m.id]); return; }
    if(m.locked){
      if(!KEYS[m.course]){ showLock(m); return; }
      $("app").innerHTML='<p class="sub">Loading lesson…</p>';
      var ls=document.createElement("script"); ls.src="lessons/"+m.file;
      ls.onload=function(){
        var e=(window.__E||{})[m.id];
        if(!e){ $("app").textContent="This lesson file did not load correctly."; return; }
        decryptB64(KEYS[m.course],e).then(function(code){
          var s2=document.createElement("script"); s2.text=code; document.head.appendChild(s2);
          if(window.__L[m.id]) render(window.__L[m.id]); else $("app").textContent="This lesson file did not load correctly.";
        }).catch(function(){ delete KEYS[m.course]; fillPick(); showLock(m,"Your saved code no longer works. Please enter your current code."); });
      };
      ls.onerror=function(){ $("app").textContent="Could not load this lesson."; };
      document.head.appendChild(ls);
      return;
    }
    $("app").innerHTML='<p class="sub">Loading lesson…</p>';
    var s=document.createElement("script"); s.src="lessons/"+m.file;
    s.onload=function(){ if(window.__L[m.id]) render(window.__L[m.id]); else $("app").textContent="This lesson file did not load correctly."; };
    s.onerror=function(){ $("app").textContent="Could not load this lesson."; };
    document.head.appendChild(s);
  }


  function showLock(m,msg){
    var C=(G&&G.courses&&G.courses[m.course])||{};
    var buy=C.buy?'<p class="sub"><a href="'+esc(C.buy)+'">Enrol to get your access code</a></p>':"";
    $("app").innerHTML='<section class="card"><h2>This lesson is for enrolled students</h2>'+
      '<p class="sub">Lesson '+esc(m.num)+', '+esc(m.title)+', is part of <b>'+esc(C.name||"the course")+'</b>. Enter your access code to unlock it. '+esc(C.freeText||"")+'</p>'+
      '<div class="btns"><input id="code" class="ans" style="width:220px" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Access code" aria-label="Access code">'+
      '<button class="primary" id="unlock">Unlock</button></div>'+
      '<p class="sub" id="lockmsg" role="status" aria-live="polite">'+esc(msg||"")+'</p>'+buy+'</section>';
    var go1=function(){
      var v=$("code").value; if(!v.trim()) return;
      $("lockmsg").textContent="Checking…";
      tryCode(v).then(function(){ fillPick(); route(); }).catch(function(){ $("lockmsg").textContent="That code is not correct. Check it and try again."; });
    };
    $("unlock").onclick=go1;
    $("code").onkeydown=function(e){ if(e.key==="Enter") go1(); };
  }

  /* ---------- rendering ---------- */
  function paramHtml(id){
    var p=null; L.params.forEach(function(q){ if(q.id===id) p=q; });
    if(p.type==="select"){
      return '<select data-param="'+id+'" aria-label="'+esc(p.label)+'">'+p.options.map(function(o){return '<option'+(o===p.value?' selected':'')+'>'+esc(o)+'</option>'}).join("")+'</select>';
    }
    return '<input data-param="'+id+'" type="number" inputmode="numeric" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+p.value+'" aria-label="'+esc(p.label)+'">';
  }
  function codeHtml(){
    return L.code.map(function(line,i){
      var parts=line.split("//"), codePart=parts[0], com=parts.length>1?"//"+parts.slice(1).join("//"):"";
      var html=esc(codePart).replace(/\{\{(\w+)\}\}/g,function(_,id){ return paramHtml(id); });
      if(com) html+='<span class="c">'+esc(com)+'</span>';
      return '<div class="ln" data-l="'+(i+1)+'"><i>'+(i+1)+'</i><span>'+(html||" ")+'</span></div>';
    }).join("");
  }
  function ledGroup(y,c){
    return '<g id="res"><rect x="170" y="'+(y-12)+'" width="50" height="24" rx="5" fill="#d6b48a" stroke="#8b6b3d"/>'+
    '<rect x="182" y="'+(y-12)+'" width="5" height="24" fill="#7c2d12"/><rect x="193" y="'+(y-12)+'" width="5" height="24" fill="#7c2d12"/><rect x="204" y="'+(y-12)+'" width="5" height="24" fill="#b45309"/>'+
    '<text x="195" y="'+(y+30)+'" font-size="12" text-anchor="middle" fill="var(--muted)">'+esc(c.resistor)+'</text></g>'+
    '<path id="bypass" class="hide" d="M170 '+y+' L220 '+y+'" fill="none" stroke="var(--wire)" stroke-width="3"/>'+
    '<circle id="glow" cx="295" cy="'+y+'" r="34" fill="var(--led)" opacity="0"/>'+
    '<polygon points="274,'+(y-18)+' 274,'+(y+18)+' 306,'+y+'" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>'+
    '<line x1="306" y1="'+(y-18)+'" x2="306" y2="'+(y+18)+'" stroke="var(--ink)" stroke-width="3"/>'+
    '<circle id="ledfill" cx="290" cy="'+y+'" r="9" fill="var(--led)" opacity="0.15"/>'+
    '<text x="270" y="'+(y-24)+'" font-size="12" fill="var(--muted)" text-anchor="middle">+</text>'+
    '<text x="322" y="'+(y-24)+'" font-size="12" fill="var(--muted)" text-anchor="middle">−</text>'+
    '<text x="295" y="'+(y+42)+'" font-size="12" fill="var(--muted)" text-anchor="middle">LED</text>';

  function wirePath(id,d,dur){

  function drawScope(duty,live){

    var c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);

  function bindUp(){
    var t0=0, lines=[
      [0,"Compiling sketch…"],
      [1100,"Sketch uses around 900 bytes (2%) of program storage space. Maximum is 32256 bytes."],
      [1300,"Done compiling."],
      [1500,"Uploading…"],
      [3700,"Done uploading."]
    ], shown=0, stNodes=document.querySelectorAll("#upst span");
    function stage(n){ stNodes.forEach(function(e,i){ e.className=i<n?"done":(i===n?"on":""); }); }
    function led(id,on){ $(id).classList.toggle("on",on); }
    $("upgo").onclick=function(){
      if(R.upTimer) clearInterval(R.upTimer);
      t0=performance.now(); shown=0; $("upcon").textContent=""; $("upbar").style.width="0%"; stage(0);
      led("ldTX",false); led("ldRX",false); led("ldL",false);
      $("upgo").textContent="Simulate again";
      R.upTimer=setInterval(function(){
        if(!$("upcon")){ clearInterval(R.upTimer); R.upTimer=null; return; }
        var t=performance.now()-t0;
        while(shown<lines.length && t>=lines[shown][0]){ $("upcon").textContent+=(shown?"\n":"")+lines[shown][1]; shown++; }
        if(t<1500){ stage(0); $("upbar").style.width=Math.min(100,t/1500*50)+"%"; led("ldTX",false); led("ldRX",false); led("ldL",false); }
        else if(t<3700){ stage(1); $("upbar").style.width=(50+(t-1500)/2200*50)+"%"; led("ldTX",Math.random()>0.45); led("ldRX",Math.random()>0.55); led("ldL",false); }
        else { stage(3); $("upbar").style.width="100%"; led("ldTX",false); led("ldRX",false); led("ldL",Math.floor((t-3700)/1000)%2===0); stNodes[2].className="on"; }
      },80);
    };
  }

      '<div class="chain"><div class="box"><b>setup()</b><span id="stsetup">waiting</span></div><div class="box"><b>loop()</b><span id="stloop">waiting</span></div><div class="box"><b>LED</b><div class="bulb" id="stbulb"></div></div></div>'+
      '<div class="desc" id="stnote" aria-live="polite">Press Next step to run the first line.</div>'+

  function bindStep(c){
    var n=-1, led=0;
    function stopAuto(){ if(R.stTimer){ clearInterval(R.stTimer); R.stTimer=null; } if($("stauto")) $("stauto").textContent="Auto-run"; }
    function paint(){
      var st=null, round=0;
      if(n===0) st=c.setup; else if(n>0){ st=c.loop[(n-1)%c.loop.length]; round=Math.floor((n-1)/c.loop.length)+1; }
      document.querySelectorAll("#stcode .ln").forEach(function(l){ l.classList.toggle("on",!!st && parseInt(l.getAttribute("data-l"),10)===st.l); });
      $("stsetup").textContent=n<0?"waiting":"ran once ✓";
      $("stloop").textContent=n<1?"waiting":"round "+round;
      $("stbulb").classList.toggle("on",!!led);
      $("stnote").innerHTML=st?st.note:"Press Next step to run the first line.";
    }
    function next(){
      n++;
      var st=n===0?c.setup:c.loop[(n-1)%c.loop.length];
      if(st.led!==undefined) led=st.led;
      paint();
    }
    $("stnext").onclick=function(){ stopAuto(); next(); };
    $("stauto").onclick=function(){
      if(R.stTimer){ stopAuto(); return; }
      next(); $("stauto").textContent="Pause";
      R.stTimer=setInterval(function(){ if(!$("stnote")){ stopAuto(); return; } next(); },1100);
    };
    $("streset").onclick=function(){ stopAuto(); n=-1; led=0; paint(); };
  }

        var best=Infinity;

  WIDGETS.overflow={
    h:function(){
      return '<div id="of"><div class="frow"><label for="oft">Data type</label><select class="ldsel" id="oft"></select></div>'+

        '<div class="desc" id="ofd" aria-live="polite">Pick a type, jump near its limit, then press + 1 or − 1.</div></div>';
    },
    b:function(){
      var T=[
        {n:"byte",bits:8,s:false},{n:"int",bits:16,s:true},{n:"unsigned int",bits:16,s:false},
        {n:"long",bits:32,s:true},{n:"unsigned long",bits:32,s:false}
      ], cur=T[1], val=0;
      function lo(t){ return t.s?-Math.pow(2,t.bits-1):0; }
      function hi(t){ return t.s?Math.pow(2,t.bits-1)-1:Math.pow(2,t.bits)-1; }
      function wrap(t,x){ var size=Math.pow(2,t.bits), m=lo(t); return (((x-m)%size)+size)%size+m; }
      function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
      function paint(msg){
        $("ofv").textContent=fmt(val); $("ofr").textContent=fmt(lo(cur))+" to "+fmt(hi(cur)); $("ofb").textContent=(cur.bits/8)+" byte"+(cur.bits>8?"s":"")+" of memory";
        if(msg) $("ofd").innerHTML=msg;
      }
      $("oft").innerHTML=T.map(function(t,i){return '<option value="'+i+'"'+(t===cur?' selected':'')+'>'+t.n+'</option>'}).join("");
      $("oft").onchange=function(){ cur=T[parseInt(this.value,10)]; val=0; paint("Range for <b>"+cur.n+"</b>: "+fmt(lo(cur))+" to "+fmt(hi(cur))+"."); };
      function step(d){
        var before=val, raw=val+d; val=wrap(cur,raw);
        paint(raw!==val ? "<b>Overflow!</b> "+fmt(before)+(d>0?" + 1":" − 1")+" does not fit in a "+cur.n+", so it wraps around to <b>"+fmt(val)+"</b>. There is no error message, so choose a type big enough for your values." : "");
        if(raw===val) $("ofd").textContent=fmt(before)+(d>0?" + 1 = ":" − 1 = ")+fmt(val)+".";
      }
      $("ofp").onclick=function(){ step(1); }; $("ofm").onclick=function(){ step(-1); };
      $("ofh").onclick=function(){ val=hi(cur)-2; paint("Now press + 1 three times."); };
      $("ofl").onclick=function(){ val=lo(cur)+2; paint("Now press − 1 three times."); };
      paint();
    }
  };

        '<pre class="code" id="flcode"></pre><div class="stats"><div class="stat"><b id="fli">–</b><span>i</span></div><div class="stat"><b id="flc">0</b><span>times body ran</span></div></div>'+

    b:function(L){

      function op(){ return $("flop").value; }
      function rule(){ return c.rules?$("flrule").value:"none"; }
      function lim(){ return parseInt($("flend").value,10); }
      function test(){ return op()==="<"? i<lim() : i<=lim(); }
      function code(){
        var h="for (int i = 0; i "+op()+" "+lim()+"; i++) {";
        var body=c.body.slice();
        if(rule()==="continue") body=["  if (i == 2) continue;"].concat(body);
        if(rule()==="break") body=["  if (i == 3) break;"].concat(body);
        var lines=[h].concat(body,["}"]);
        $("flcode").innerHTML=lines.map(function(t,k){return '<div class="ln" data-l="'+k+'"><i>'+(k+1)+'</i><span>'+esc(t)+'</span></div>';}).join("");
        return lines.length;
      }
      var n;
      function hl(a){ document.querySelectorAll("#flcode .ln").forEach(function(l){ l.classList.toggle("on",a.indexOf(parseInt(l.getAttribute("data-l"),10))>=0); }); }
      function reset(){ i=0; ran=0; st="test"; log=[]; done=false; $("flendv").textContent=lim(); n=code(); paint("Press Step to run one stage."); hl([]); }
      function paint(m){ $("fli").textContent=done?"–":i; $("flc").textContent=ran; $("fllog").textContent=(log.length?log.slice(-6).join("\n")+"\n":"")+m; }

        var r=rule();

          else { done=true; paint("Test is false, so the loop ends."); }
        } else if(st==="body"){
          if(r==="continue"&&i===2){ log.push("i = 2: continue, skip the rest"); hl([1]); st="inc"; paint("continue jumps straight to i++."); return; }
          if(r==="break"&&i===3){ log.push("i = 3: break"); hl([1]); done=true; paint("break leaves the loop immediately."); return; }

        } else { i++; hl([0]); st="test"; paint("i++ makes i = "+i+"."); }
      }
      $("flstep").onclick=step;

      $("flreset").onclick=reset;

  /* ---------- serial widgets ---------- */

      function out(t){ log.push(t); if(log.length>40) log.shift(); $("smlog").textContent=log.join("\n"); $("smlog").scrollTop=1e6; }
      $("smst").textContent="9600 baud";
      $("smclr").onclick=function(){ log=[]; n=0; presses=0; $("smlog").textContent=""; };
      if(c.mode==="print"){

        tm=setInterval(function(){ if(!$("sm")){clearInterval(tm);return;} if(!running) return; hl([c.hl||0]); out(c.line(n)); n++; },600);

  /* ---------- analog / ADC widgets ---------- */

  WIDGETS.mapw={
